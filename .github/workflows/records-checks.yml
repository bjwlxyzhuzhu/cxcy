name: Test learning records
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  records:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-password
          POSTGRES_DB: cxcy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        env:
          EXPORT_PDF_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
      - run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:fixture-password@127.0.0.1:5432/cxcy_test
          EXPORT_PDF_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
      - run: pnpm build
