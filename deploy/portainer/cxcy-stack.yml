# 将此 services.cxcy 合并到 Supabase 官方 docker-compose.yml 的 services 下，
# 然后在 Portainer Web Editor 以一个 Stack 一起部署。
# Supabase 官方 Compose 的默认网络会自动让 cxcy 访问 kong:8000；浏览器 URL
# 必须使用 API_EXTERNAL_URL（公网地址），不能写 Docker 内部服务名。
services:
  cxcy:
    container_name: cxcy-web
    image: ghcr.io/bjwlxyzhuzhu/cxcy:latest
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      SUPABASE_PUBLIC_URL: ${API_EXTERNAL_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      APIMART_BASE_URL: ${APIMART_BASE_URL}
      APIMART_API_KEY: ${APIMART_API_KEY}
      CHAT_MODEL: ${CHAT_MODEL}
      IMAGE_MODEL: ${IMAGE_MODEL}
      EMBED_MODEL: ${EMBED_MODEL}
      CHAT_BASE_URL: ${CHAT_BASE_URL}
      CHAT_API_KEY: ${CHAT_API_KEY}
      PPTGEN_BASE_URL: ${PPTGEN_BASE_URL}
      PPTGEN_PUBLIC_URL: ${PPTGEN_PUBLIC_URL}
      PPTGEN_AUTH: ${PPTGEN_AUTH}
