# 本地完整环境请在仓库根目录使用 docker-compose.postgres.yml。
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cxcy}
      POSTGRES_USER: ${POSTGRES_USER:-cxcy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - cxcy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cxcy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cxcy}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      APIMART_BASE_URL: ${APIMART_BASE_URL}
      APIMART_API_KEY: ${APIMART_API_KEY}
      CHAT_MODEL: ${CHAT_MODEL}
      IMAGE_MODEL: ${IMAGE_MODEL}
      EMBED_MODEL: ${EMBED_MODEL}
      CHAT_BASE_URL: ${CHAT_BASE_URL}
      CHAT_API_KEY: ${CHAT_API_KEY}
      PPTGEN_BASE_URL: ${PPTGEN_BASE_URL}
      PPTGEN_PUBLIC_URL: ${PPTGEN_PUBLIC_URL}
      PPTGEN_AUTH: ${PPTGEN_AUTH}
    restart: unless-stopped
volumes:
  cxcy_postgres_data:
