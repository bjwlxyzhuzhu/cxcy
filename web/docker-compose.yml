# 启动：docker compose --env-file .env.local up --build
# --env-file 让 compose 用 .env.local 既做构建参数替换、又做运行期环境注入
services:
  web:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      # Portainer uses SUPABASE_*; local .env.local keeps the old NEXT_PUBLIC_* names.
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-${NEXT_PUBLIC_SUPABASE_URL}}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY}}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      APIMART_BASE_URL: ${APIMART_BASE_URL}
      APIMART_API_KEY: ${APIMART_API_KEY}
      CHAT_MODEL: ${CHAT_MODEL}
      IMAGE_MODEL: ${IMAGE_MODEL}
      EMBED_MODEL: ${EMBED_MODEL}
      CHAT_BASE_URL: ${CHAT_BASE_URL}
      CHAT_API_KEY: ${CHAT_API_KEY}
      PPTGEN_BASE_URL: ${PPTGEN_BASE_URL}
      PPTGEN_PUBLIC_URL: ${PPTGEN_PUBLIC_URL}
      PPTGEN_AUTH: ${PPTGEN_AUTH}
    restart: unless-stopped
