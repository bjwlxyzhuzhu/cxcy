# 启动：docker compose up -d --build
# 首个教师账号：docker compose exec web node scripts/create-user.mjs <账号> <密码> teacher
# 数据库在 ./data/app.db（宿主机目录），备份/迁移服务器时拷走整个 data 目录即可
services:
  web:
    build:
      context: .
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env.local
    environment:
      DATABASE_URL: file:/app/data/app.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
