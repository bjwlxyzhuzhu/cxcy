<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>双创AI实验室 · 风格B 赛博霓虹脉冲</title>
<style>
:root{--bg:#0a0618;--ink:#f3eaff;--mut:#a78fd6;--cyan:#16f2e3;--pink:#ff2bd6;--violet:#9d5cff;--amber:#ffd23f;--line:rgba(255,43,214,.28)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden;line-height:1.6}
.bg{position:fixed;inset:0;z-index:-3;background:linear-gradient(180deg,#0a0618 0%,#1a0a36 55%,#2a0a40 100%)}
/* 透视霓虹网格 */
.grid3d{position:fixed;left:0;right:0;bottom:0;height:55vh;z-index:-2;perspective:340px;overflow:hidden}
.grid3d::before{content:"";position:absolute;inset:-50% -50% 0;background:linear-gradient(rgba(255,43,214,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(22,242,227,.5) 1px,transparent 1px);background-size:44px 44px;transform:rotateX(72deg);transform-origin:bottom;animation:grid 2.2s linear infinite;mask:linear-gradient(transparent,#000 60%)}
@keyframes grid{to{background-position:0 44px}}
.sun{position:fixed;top:8%;left:50%;transform:translateX(-50%);width:280px;height:280px;border-radius:50%;background:linear-gradient(180deg,#ff2bd6,#9d5cff 60%,transparent);filter:blur(2px);opacity:.55;z-index:-2;box-shadow:0 0 120px rgba(255,43,214,.6)}
.scan{position:fixed;inset:0;z-index:60;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.16) 2px 4px);mix-blend-mode:overlay;animation:flick 4s steps(2) infinite}@keyframes flick{50%{opacity:.7}}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px;position:relative;z-index:2}
nav{display:flex;align-items:center;gap:14px;padding:18px 0}
.logo{width:42px;height:42px;border-radius:10px;background:#120726;border:1.5px solid var(--pink);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--cyan);box-shadow:0 0 16px var(--pink),inset 0 0 12px rgba(255,43,214,.4)}
.brand b{font-weight:800;font-size:18px;text-shadow:0 0 12px rgba(22,242,227,.6)}.brand small{display:block;font-size:10px;color:var(--mut);letter-spacing:1.5px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;padding:7px 14px;border:1px solid var(--cyan);border-radius:6px;background:rgba(22,242,227,.07);box-shadow:0 0 12px rgba(22,242,227,.3)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber);animation:blink 1.2s infinite}@keyframes blink{50%{opacity:.3}}
.av{width:37px;height:37px;border-radius:8px;background:linear-gradient(135deg,var(--pink),var(--violet));display:grid;place-items:center;font-weight:700;box-shadow:0 0 14px rgba(255,43,214,.5)}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;padding:34px 0 14px}
.tag{display:inline-block;font-size:12px;color:var(--cyan);border:1px solid var(--cyan);padding:6px 13px;border-radius:6px;background:rgba(22,242,227,.06);margin-bottom:18px;letter-spacing:1px;box-shadow:0 0 14px rgba(22,242,227,.25)}
h1{font-size:44px;line-height:1.12;font-weight:800;letter-spacing:0}
.glitch{position:relative;color:#fff;text-shadow:0 0 18px rgba(255,43,214,.5)}
.glitch span{background:linear-gradient(120deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;position:relative}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;clip-path:inset(0 0 0 0)}
.glitch::before{color:var(--cyan);transform:translate(-2px,0);animation:gl1 3s infinite linear alternate}
.glitch::after{color:var(--pink);transform:translate(2px,0);animation:gl2 2.4s infinite linear alternate}
@keyframes gl1{0%,92%{clip-path:inset(0 0 100% 0)}93%{clip-path:inset(10% 0 60% 0)}96%{clip-path:inset(50% 0 20% 0)}100%{clip-path:inset(0 0 100% 0)}}
@keyframes gl2{0%,90%{clip-path:inset(100% 0 0 0)}91%{clip-path:inset(40% 0 40% 0)}95%{clip-path:inset(70% 0 10% 0)}100%{clip-path:inset(100% 0 0 0)}}
.sub{color:var(--mut);font-size:15px;margin:16px 0 20px;max-width:500px;min-height:48px}
.cur{display:inline-block;width:9px;background:var(--cyan);margin-left:2px;animation:blink .8s steps(1) infinite}
.team{display:flex;gap:9px;flex-wrap:wrap}
.buddy{font-size:13px;padding:8px 13px;border:1px solid var(--line);border-radius:7px;background:rgba(255,43,214,.06);transition:.2s;cursor:default}
.buddy:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 16px rgba(22,242,227,.4);transform:translateY(-3px)}
.herofig{position:relative;border-radius:14px;aspect-ratio:1/1;display:grid;place-items:center;border:1.5px solid var(--pink);background:rgba(20,8,40,.5);box-shadow:0 0 40px rgba(255,43,214,.3),inset 0 0 40px rgba(157,92,255,.2);overflow:hidden}
.core{width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#bff8f2,var(--cyan) 45%,var(--violet) 100%);box-shadow:0 0 60px var(--cyan);animation:pulse 2.6s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.08)}}
.hxline{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 10px var(--cyan);animation:scn 3s linear infinite}@keyframes scn{0%{top:0}100%{top:100%}}
.cap{position:absolute;bottom:14px;font-size:12px;color:var(--cyan);letter-spacing:1px}
.switchwrap{display:flex;justify-content:center;margin:38px 0 8px}
.switch{position:relative;display:flex;border:1.5px solid var(--violet);border-radius:8px;padding:5px;width:380px;background:rgba(20,8,40,.5);box-shadow:0 0 18px rgba(157,92,255,.3)}
.switch button{flex:1;z-index:2;background:none;border:none;color:var(--mut);font-size:15px;font-weight:700;padding:12px 0;cursor:pointer;font-family:inherit;transition:.3s}
.switch button.on{color:#0a0618}
.slider{position:absolute;top:5px;left:5px;width:calc(50% - 5px);height:calc(100% - 10px);border-radius:6px;background:linear-gradient(120deg,var(--cyan),var(--pink));transition:transform .35s cubic-bezier(.2,.9,.3,1.3);box-shadow:0 0 20px rgba(255,43,214,.6)}
.slider.r{transform:translateX(100%)}
.zonecap{text-align:center;color:var(--mut);font-size:13px;margin:8px 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px}
.mod{position:relative;border:1px solid var(--line);border-radius:12px;padding:20px;cursor:pointer;background:rgba(20,8,40,.45);transition:.25s;opacity:0;transform:translateY(16px);animation:up .5s forwards;overflow:hidden}
@keyframes up{to{opacity:1;transform:none}}
.mod:hover{transform:translateY(-6px);border-color:var(--cyan);box-shadow:0 0 26px rgba(22,242,227,.35)}
.mod::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(22,242,227,.18),transparent);transform:skewX(-20deg);transition:.5s}
.mod:hover::after{left:120%}
.mi{width:52px;height:52px;border-radius:11px;display:grid;place-items:center;font-size:25px;margin-bottom:13px;border:1px solid var(--line)}
.mod h3{font-size:16px;margin-bottom:5px}.mod p{font-size:13px;color:var(--mut)}
.badge{display:inline-block;font-size:11px;margin-top:10px;padding:3px 10px;border-radius:5px;border:1px solid var(--cyan);color:var(--cyan)}
.fab{position:fixed;right:24px;bottom:24px;display:flex;align-items:center;gap:9px;padding:13px 19px;border-radius:8px;background:linear-gradient(120deg,var(--cyan),var(--pink));color:#0a0618;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 0 30px rgba(255,43,214,.6);z-index:70}
footer{color:var(--mut);font-size:12px;text-align:center;padding:32px 0;border-top:1px solid var(--line);margin-top:34px}
@media(max-width:820px){.hero{grid-template-columns:1fr}h1{font-size:32px}}
</style></head>
<body>
<div class="bg"></div><div class="sun"></div><div class="grid3d"></div><div class="scan"></div>
<div class="wrap">
  <nav><div class="logo">双创</div><div class="brand"><b>双创AI实验室</b><small>DOUBLE INNOVATION AI LAB</small></div><div class="spacer"></div><span class="chip"><span class="dot"></span>积分 120</span><div class="av">朱</div></nav>
  <section class="hero">
    <div>
      <span class="tag">创新创业教育 · 比赛 · AI 工具应用</span>
      <h1 class="glitch" data-t="懂创赛的智能搭子">不是一个 AI，<br>是一群<span>懂创赛的智能搭子</span></h1>
      <p class="sub" id="sub"></p>
      <div class="team"><span class="buddy">🎯 选题搭子</span><span class="buddy">✍️ 写作搭子</span><span class="buddy">🖼️ PPT搭子</span><span class="buddy">🎤 路演搭子</span><span class="buddy">⚖️ 答辩搭子</span><span class="buddy">📊 数据搭子</span><span class="buddy">🤝 组队搭子</span></div>
    </div>
    <div class="herofig"><div class="core"></div><div class="hxline"></div><div class="cap">数字人「小航」· 赛博形态</div></div>
  </section>
  <div class="switchwrap"><div class="switch"><div class="slider" id="sld"></div><button class="on" onclick="setZone(0)">📚 学习中心</button><button onclick="setZone(1)">🚀 应用中心</button></div></div>
  <div class="zonecap" id="zc"></div>
  <div class="grid" id="grid"></div>
  <footer>风格B · 赛博霓虹脉冲　|　透视霓虹网格 + 故障文字 + 扫描线 + 霓虹辉光　|　双创AI实验室</footer>
</div>
<div class="fab">💬 AI 客服 · 百问百答</div>
<script>
// 打字机
const txt='选题、写作、做 PPT、磨路演、上战场——智能体集群，陪你从想法到夺奖。';let i=0;const sub=document.getElementById('sub');
(function tp(){if(i<=txt.length){sub.innerHTML=txt.slice(0,i)+'<span class="cur">&nbsp;</span>';i++;setTimeout(tp,55)}})();
const tint={cyan:'rgba(22,242,227,.14)',violet:'rgba(157,92,255,.16)',pink:'rgba(255,43,214,.14)',amber:'rgba(255,210,63,.16)',green:'rgba(94,224,160,.16)'};
const Z=[{cap:'打基础、拿资源：学理论 · 读政策 · 看案例 · 拿模板 · 直达平台',m:[['📘','理论知识','五模块课件，AI 老师讲给你听','cyan','5 模块'],['📜','政策解读','双创赛事政策一键看懂，自动划重点','violet','实时'],['💡','案例库','50 个区域产业案例＋获奖项目拆解','pink','50+'],['🧰','模板库','BP、路演PPT、专利、合同随取随用','amber','20+'],['🎮','题库闯关','1000 题＋卡牌闯关，边玩边学','green','1000 题'],['🔗','平台直达','一键跳转攒经验拿证书（合规导流）','cyan','导流']]},{cap:'上战场、出成果：生成资料 · 模拟路演 · 协作组队',m:[['🎯','选题与赛道匹配','主动帮你定方向，怎么组队也给建议','violet','主动式'],['✍️','文本生成','商业计划书、专利、合同、文案一键起草','cyan','一键'],['🖼️','PPT 生成','大纲＋逐字稿＋GPT Image 2 配图出片','pink','配图'],['⚖️','模拟路演答辩','国赛评委连环追问、按细则挑硬伤','amber','评委级'],['📊','数据分析','调研数据自动出结论与可视化图表','green','可视化'],['🤝','组队协作','跨校组队广场，团队共编 PPT','violet','协作']]}];
let zone=0;
function render(){const g=document.getElementById('grid');g.innerHTML='';Z[zone].m.forEach((m,k)=>{const d=document.createElement('div');d.className='mod';d.style.animationDelay=(k*.06)+'s';d.innerHTML=`<div class="mi" style="background:${tint[m[3]]}">${m[0]}</div><h3>${m[1]}</h3><p>${m[2]}</p><span class="badge">${m[4]}</span>`;g.appendChild(d)});document.getElementById('zc').textContent=Z[zone].cap}
function setZone(z){zone=z;document.getElementById('sld').classList.toggle('r',z===1);document.querySelectorAll('.switch button').forEach((b,k)=>b.classList.toggle('on',k===z));render()}
render();
</script></body></html>
