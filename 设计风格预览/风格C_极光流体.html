<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>双创AI实验室 · 风格C 极光流体柔光</title>
<style>
:root{--bg:#0c1228;--ink:#eaf0ff;--mut:#9fb0d6;--c1:#5eead4;--c2:#818cf8;--c3:#f0abfc;--c4:#fcd34d;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden;line-height:1.65}
/* 极光流体 */
.aurora{position:fixed;inset:-20%;z-index:-2;filter:blur(80px) saturate(140%)}
.blob{position:absolute;border-radius:50%;opacity:.55;mix-blend-mode:screen;animation:drift 18s ease-in-out infinite}
.b1{width:46vw;height:46vw;background:#5eead4;top:-6%;left:-4%}
.b2{width:42vw;height:42vw;background:#818cf8;top:10%;right:-6%;animation-delay:-5s}
.b3{width:40vw;height:40vw;background:#f0abfc;bottom:-12%;left:22%;animation-delay:-9s}
.b4{width:30vw;height:30vw;background:#38bdf8;bottom:6%;right:14%;animation-delay:-13s}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(6%,8%) scale(1.12)}66%{transform:translate(-5%,4%) scale(.94)}}
.cursorglow{position:fixed;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(129,140,248,.18),transparent 65%);pointer-events:none;z-index:-1;transform:translate(-50%,-50%);transition:.18s ease-out}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
nav{display:flex;align-items:center;gap:14px;padding:20px 0}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--c1),var(--c2) 55%,var(--c3));display:grid;place-items:center;font-weight:800;font-size:14px;color:#0c1228;box-shadow:0 8px 24px rgba(129,140,248,.4)}
.brand b{font-weight:800;font-size:18px}.brand small{display:block;font-size:10px;color:var(--mut);letter-spacing:1px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;padding:8px 15px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(18px)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c4);box-shadow:0 0 10px var(--c4)}
.av{width:37px;height:37px;border-radius:50%;background:linear-gradient(135deg,var(--c2),var(--c1));display:grid;place-items:center;font-weight:600;color:#0c1228}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:32px;align-items:center;padding:34px 0 14px}
.tag{display:inline-block;font-size:13px;color:var(--ink);border:1px solid var(--line);padding:7px 14px;border-radius:999px;background:var(--glass);backdrop-filter:blur(14px);margin-bottom:18px}
h1{font-size:46px;line-height:1.12;font-weight:800;letter-spacing:-.5px}
.g{background:linear-gradient(110deg,var(--c1),var(--c2) 45%,var(--c3) 80%);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% auto;animation:flow 6s ease infinite}@keyframes flow{50%{background-position:100% center}}
.sub{color:var(--mut);font-size:15.5px;margin:16px 0 22px;max-width:500px}
.team{display:flex;gap:10px;flex-wrap:wrap}
.buddy{font-size:13px;padding:9px 15px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(14px);transition:.3s cubic-bezier(.2,.9,.3,1.3);cursor:default}
.buddy:hover{transform:translateY(-4px) scale(1.05);border-color:rgba(129,140,248,.6);box-shadow:0 12px 30px rgba(129,140,248,.3)}
.herofig{position:relative;border-radius:28px;aspect-ratio:1/1;display:grid;place-items:center;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(20px);overflow:hidden}
.core{width:160px;height:160px;background:linear-gradient(135deg,var(--c1),var(--c2) 50%,var(--c3));box-shadow:0 0 80px rgba(129,140,248,.5),inset 0 0 50px rgba(255,255,255,.3);animation:morph 8s ease-in-out infinite}
@keyframes morph{0%,100%{border-radius:42% 58% 60% 40%/45% 42% 58% 55%}50%{border-radius:58% 42% 40% 60%/55% 58% 42% 45%}}
.cap{position:absolute;bottom:18px;font-size:12px;color:var(--mut)}
.switchwrap{display:flex;justify-content:center;margin:40px 0 8px}
.switch{position:relative;display:flex;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px;width:380px;backdrop-filter:blur(18px)}
.switch button{flex:1;z-index:2;background:none;border:none;color:var(--mut);font-size:15px;font-weight:600;padding:13px 0;cursor:pointer;font-family:inherit;transition:.3s}
.switch button.on{color:#0c1228}
.slider{position:absolute;top:6px;left:6px;width:calc(50% - 6px);height:calc(100% - 12px);border-radius:999px;background:linear-gradient(110deg,var(--c1),var(--c2));transition:transform .45s cubic-bezier(.2,.9,.3,1.3);box-shadow:0 8px 26px rgba(129,140,248,.45)}
.slider.r{transform:translateX(100%)}
.zonecap{text-align:center;color:var(--mut);font-size:13px;margin:10px 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px}
.mod{border:1px solid var(--line);border-radius:24px;padding:22px;cursor:pointer;background:var(--glass);backdrop-filter:blur(16px);transition:.35s cubic-bezier(.2,.9,.3,1.2);opacity:0;transform:translateY(20px);animation:up .6s forwards}
@keyframes up{to{opacity:1;transform:none}}
.mod:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 22px 50px rgba(0,0,0,.3);border-color:rgba(255,255,255,.25)}
.mi{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:26px;margin-bottom:14px}
.mod h3{font-size:16px;margin-bottom:6px}.mod p{font-size:13px;color:var(--mut)}
.badge{display:inline-block;font-size:11px;margin-top:11px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.fab{position:fixed;right:24px;bottom:24px;display:flex;align-items:center;gap:9px;padding:14px 20px;border-radius:999px;background:linear-gradient(110deg,var(--c1),var(--c2) 60%,var(--c3));color:#0c1228;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 14px 40px rgba(129,140,248,.5)}
footer{color:var(--mut);font-size:12px;text-align:center;padding:34px 0;border-top:1px solid var(--line);margin-top:36px}
@media(max-width:820px){.hero{grid-template-columns:1fr}h1{font-size:33px}}
</style></head>
<body>
<div class="aurora"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div></div>
<div class="cursorglow" id="cg"></div>
<div class="wrap">
  <nav><div class="logo">双创</div><div class="brand"><b>双创AI实验室</b><small>DOUBLE INNOVATION AI LAB</small></div><div class="spacer"></div><span class="chip"><span class="dot"></span>积分 120</span><div class="av">朱</div></nav>
  <section class="hero">
    <div>
      <span class="tag">创新创业教育 · 比赛 · AI 工具应用</span>
      <h1>不是一个 AI，<br>是一群<span class="g">懂创赛的智能搭子</span></h1>
      <p class="sub">选题、写作、做 PPT、磨路演、上战场——双创AI实验室的智能体集群，一路陪你从想法到夺奖。</p>
      <div class="team"><span class="buddy">🎯 选题搭子</span><span class="buddy">✍️ 写作搭子</span><span class="buddy">🖼️ PPT搭子</span><span class="buddy">🎤 路演搭子</span><span class="buddy">⚖️ 答辩搭子</span><span class="buddy">📊 数据搭子</span><span class="buddy">🤝 组队搭子</span></div>
    </div>
    <div class="herofig"><div class="core"></div><div class="cap">数字人「小航」· 流体形态</div></div>
  </section>
  <div class="switchwrap"><div class="switch"><div class="slider" id="sld"></div><button class="on" onclick="setZone(0)">📚 学习中心</button><button onclick="setZone(1)">🚀 应用中心</button></div></div>
  <div class="zonecap" id="zc"></div>
  <div class="grid" id="grid"></div>
  <footer>风格C · 极光流体柔光　|　动态极光背景 + 强磨砂玻璃 + 流体数字人 + 鼠标光晕　|　双创AI实验室</footer>
</div>
<div class="fab">💬 AI 客服 · 百问百答</div>
<script>
const cg=document.getElementById('cg');addEventListener('mousemove',e=>{cg.style.left=e.clientX+'px';cg.style.top=e.clientY+'px'});
const tint={c1:'rgba(94,234,212,.16)',c2:'rgba(129,140,248,.18)',c3:'rgba(240,171,252,.16)',c4:'rgba(252,211,77,.18)',c5:'rgba(56,189,248,.16)'};
const Z=[{cap:'打基础、拿资源：学理论 · 读政策 · 看案例 · 拿模板 · 直达平台',m:[['📘','理论知识','五模块课件，AI 老师讲给你听','c1','5 模块'],['📜','政策解读','双创赛事政策一键看懂，自动划重点','c2','实时'],['💡','案例库','50 个区域产业案例＋获奖项目拆解','c3','50+'],['🧰','模板库','BP、路演PPT、专利、合同随取随用','c4','20+'],['🎮','题库闯关','1000 题＋卡牌闯关，边玩边学','c5','1000 题'],['🔗','平台直达','一键跳转攒经验拿证书（合规导流）','c1','导流']]},{cap:'上战场、出成果：生成资料 · 模拟路演 · 协作组队',m:[['🎯','选题与赛道匹配','主动帮你定方向，怎么组队也给建议','c2','主动式'],['✍️','文本生成','商业计划书、专利、合同、文案一键起草','c1','一键'],['🖼️','PPT 生成','大纲＋逐字稿＋GPT Image 2 配图出片','c3','配图'],['⚖️','模拟路演答辩','国赛评委连环追问、按细则挑硬伤','c4','评委级'],['📊','数据分析','调研数据自动出结论与可视化图表','c5','可视化'],['🤝','组队协作','跨校组队广场，团队共编 PPT','c2','协作']]}];
let zone=0;
function render(){const g=document.getElementById('grid');g.innerHTML='';Z[zone].m.forEach((m,k)=>{const d=document.createElement('div');d.className='mod';d.style.animationDelay=(k*.07)+'s';d.innerHTML=`<div class="mi" style="background:${tint[m[3]]}">${m[0]}</div><h3>${m[1]}</h3><p>${m[2]}</p><span class="badge">${m[4]}</span>`;g.appendChild(d)});document.getElementById('zc').textContent=Z[zone].cap}
function setZone(z){zone=z;document.getElementById('sld').classList.toggle('r',z===1);document.querySelectorAll('.switch button').forEach((b,k)=>b.classList.toggle('on',k===z));render()}
render();
</script></body></html>
